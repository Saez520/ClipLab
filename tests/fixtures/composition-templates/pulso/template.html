<style>
  :root{ --bg:#000000; --accent-cyan:#10c8f0; --accent-pink:#f86868; --accent-green:#48c068; --font-display:"Inter"; --font-mono:"JetBrains Mono"; }
  *{box-sizing:border-box;}
  body{background:var(--bg); margin:0; padding:0;}
  div.clip{max-width:560px; margin:0 auto 56px;}
  .meta-bar{display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:11px;}
  .badge{display:inline-flex; border:1.5px solid var(--c); color:var(--c); font-family:var(--font-mono);}
  .badge--cyan{--c:var(--accent-cyan);}
  .heading{font-size:26px; font-weight:800; text-align:center;}
  .heading .accent{color:var(--accent-cyan);}
  .io-row{display:flex; align-items:center; gap:14px;}
  .chip{background:#0c0f15; border:1px solid #2d2d31; border-radius:10px; padding:11px 18px; font-family:var(--font-mono); font-size:13px;}
  .io-arrow{color:#666; font-size:16px;}
  .chip-output{font-family:var(--font-mono); font-size:11px; color:var(--accent-cyan);}
  .node-wrap{display:flex; justify-content:center;}
  .node{border:1.5px solid var(--accent-cyan); border-radius:16px; padding:22px 34px; text-align:center;}
  .node__title{font-family:var(--font-mono); font-weight:800; font-size:20px; color:var(--accent-cyan);}
  .node__subtitle{font-size:13px; margin-top:6px;}
  .node__desc{font-size:11px; margin-top:2px;}
  .side-nodes{display:flex; justify-content:space-between; gap:16px;}
  .side-node{flex:1; border-radius:10px; padding:14px 16px; font-family:var(--font-mono); font-size:11px;}
  .side-node--green{border:1px solid var(--accent-green); color:var(--accent-green);}
  .side-node--pink{border:1px solid var(--accent-pink); color:var(--accent-pink);}
  .steps{display:flex; gap:8px;}
  .step{flex:1; border:1px solid #2d2d31; border-radius:10px; padding:10px 6px; text-align:center;}
  .step__num{font-family:var(--font-mono); font-size:9px;}
  .step__label{font-weight:700; font-size:11px; font-family:var(--font-mono);}
  .letters{display:flex; justify-content:center; gap:34px;}
  .letter{text-align:center;}
  .letter__char{font-size:56px; font-weight:800; display:block;}
  .letter__underline{width:32px; height:2px; margin:6px auto; background:currentColor;}
  .letter__label{font-family:var(--font-mono); font-size:9px; text-transform:uppercase;}
  .chaos{position:relative; height:170px;}
  .chaos .chip{position:absolute; border-color:var(--accent-pink); font-size:11px;}
  .chaos-symbol{position:absolute; font-size:14px;}
</style>
