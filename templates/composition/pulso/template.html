<style>
  :root{
    --bg:#000000;
    --card-fill:#0c0f15;
    --card-border:#2d2d31;
    --connector:#999999;
    --text-primary:#fcfcfc;
    --text-secondary:#a3a3a3;
    --accent-cyan:#10c8f0;
    --accent-pink:#f86868;
    --accent-green:#48c068;
    --accent-violet:#7088f8;
    --font-display:'Inter', system-ui, sans-serif;
    --font-mono:'JetBrains Mono','SF Mono', ui-monospace, monospace;
  }
  *{box-sizing:border-box;}
  body{background:var(--bg); color:var(--text-primary); font-family:var(--font-display); margin:0; padding:0;}
  div.clip{max-width:560px; margin:0 auto 56px;}

  .meta-bar{display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:11px; color:var(--text-secondary);}

  .badge{display:inline-flex; align-items:center; padding:9px 22px; border-radius:999px; border:1.5px solid var(--c); color:var(--c); font-family:var(--font-mono); font-weight:700; font-size:11px; letter-spacing:0.09em; text-transform:uppercase; background:rgba(255,255,255,0.02);}
  .badge--cyan{--c:var(--accent-cyan);} .badge--pink{--c:var(--accent-pink);} .badge--green{--c:var(--accent-green);}

  .heading{font-size:26px; font-weight:800; line-height:1.3; text-align:center; margin:20px 0;}
  .heading .accent{color:var(--accent-cyan);}

  .io-row{display:flex; align-items:center; gap:14px; margin-bottom:14px;}
  .chip{background:var(--card-fill); border:1px solid var(--card-border); border-radius:10px; padding:11px 18px; font-family:var(--font-mono); font-size:13px; color:var(--text-primary); flex-shrink:0;}
  .io-arrow{color:var(--connector); font-size:16px;}
  .chip-output{font-family:var(--font-mono); font-size:11px; line-height:1.5; color:var(--accent-cyan); word-break:break-all;}

  .node-wrap{display:flex; justify-content:center; margin:28px 0;}
  .node{border:1.5px solid var(--accent-cyan); border-radius:16px; padding:22px 34px; text-align:center; background:radial-gradient(ellipse at 50% 30%, rgba(16,200,240,0.10), transparent 70%); box-shadow:0 0 50px rgba(16,200,240,0.18);}
  .node__title{font-family:var(--font-mono); font-weight:800; font-size:20px; color:var(--accent-cyan);}
  .node__subtitle{font-size:13px; margin-top:6px;}
  .node__desc{font-size:11px; color:var(--text-secondary); margin-top:2px;}
  .side-nodes{display:flex; justify-content:space-between; gap:16px; margin-bottom:28px;}
  .side-node{flex:1; border-radius:10px; padding:14px 16px; font-family:var(--font-mono); font-size:11px; font-weight:700; text-transform:uppercase;}
  .side-node--green{border:1px solid var(--accent-green); color:var(--accent-green);}
  .side-node--pink{border:1px solid var(--accent-pink); color:var(--accent-pink); text-align:right;}

  .steps{display:flex; gap:8px;}
  .step{flex:1; border:1px solid var(--card-border); background:var(--card-fill); border-radius:10px; padding:10px 6px; text-align:center;}
  .step__num{font-family:var(--font-mono); font-size:9px; color:var(--text-secondary);}
  .step__label{font-weight:700; font-size:11px; margin-top:4px; font-family:var(--font-mono);}

  .letters{display:flex; justify-content:center; gap:34px; margin:20px 0;}
  .letter{text-align:center;}
  .letter__char{font-size:56px; font-weight:800; display:block;}
  .letter__underline{width:32px; height:2px; margin:6px auto; background:currentColor; opacity:0.8;}
  .letter__label{font-family:var(--font-mono); font-size:9px; letter-spacing:0.1em; text-transform:uppercase; margin-top:8px;}

  .chaos{position:relative; height:170px;}
  .chaos .chip{position:absolute; border-color:var(--accent-pink); font-size:11px; padding:7px 13px;}
  .chaos-symbol{position:absolute; color:var(--text-secondary); font-size:14px;}
</style>
